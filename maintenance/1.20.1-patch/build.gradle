plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
}

group = 'me.aleksilassila.litematica.printer'
version = project.patch_version

base {
    archivesName = 'litematica-printer-build365-maintenance-patch'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

    if (project.hasProperty('printer_inner_jar')) {
        // prepare-baseline.ps1 changes only the Loom provenance marker in a
        // build-directory copy so Loom 1.8 can remap the intermediary oracle.
        modCompileOnly files(project.property('printer_inner_jar'))
    }
    if (project.hasProperty('litematica_jar')) {
        modCompileOnly files(project.property('litematica_jar'))
    }
    if (project.hasProperty('malilib_jar')) {
        modCompileOnly files(project.property('malilib_jar'))
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveClassifier = 'dev'
}

remapJar {
    archiveClassifier = 'remapped'
}
